services:
  tcm-cdss:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/tcm-cdss}
        NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE: ${NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE:-true}
        NEXT_DEPLOYMENT_ID: ${IMAGE_TAG:?set immutable IMAGE_TAG}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    image: "tcm-cdss:${IMAGE_TAG:?set immutable IMAGE_TAG}"
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      CDSS_RELEASE_ID: ${IMAGE_TAG:?set immutable IMAGE_TAG}
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-openai-compatible}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      CDSS_DEEPSEEK_ALLOWED_HOSTS: ${CDSS_DEEPSEEK_ALLOWED_HOSTS:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      PRIMARY_PRESCRIBE_MODEL: ${PRIMARY_PRESCRIBE_MODEL:-deepseek-v4-flash}
      PRIMARY_PRESCRIBE_REASONING_EFFORT: ${PRIMARY_PRESCRIBE_REASONING_EFFORT:-low}
      PRIMARY_PRESCRIBE_THINKING_ENABLED: ${PRIMARY_PRESCRIBE_THINKING_ENABLED:-false}
      # M04 候选方药正文较长(药味清单+君臣佐使+配伍),给独立更高上限避免截断。
      PRIMARY_PRESCRIBE_MAX_TOKENS: ${PRIMARY_PRESCRIBE_MAX_TOKENS:-24000}
      # M03 使用更强推理模型；M04 使用低时延模型，二者互作独立交叉复核兜底。
      PRIMARY_DIAGNOSE_MODEL: ${PRIMARY_DIAGNOSE_MODEL:-deepseek-v4-pro}
      PRIMARY_DIAGNOSE_REASONING_EFFORT: ${PRIMARY_DIAGNOSE_REASONING_EFFORT:-medium}
      PRIMARY_DIAGNOSE_MAX_TOKENS: ${PRIMARY_DIAGNOSE_MAX_TOKENS:-24000}
      PRIMARY_DIAGNOSE_THINKING_ENABLED: ${PRIMARY_DIAGNOSE_THINKING_ENABLED:-false}
      # All text reasoning/review stays on DeepSeek. GLM is opt-in below and is used only for tongue images.
      PRIMARY_CLINICAL_REVIEW_PROVIDER: ${PRIMARY_CLINICAL_REVIEW_PROVIDER:-primary}
      PRIMARY_CLINICAL_REVIEW_MODEL: ${PRIMARY_CLINICAL_REVIEW_MODEL:-deepseek-v4-pro}
      PRIMARY_CLINICAL_REVIEW_API_KEY: ${PRIMARY_CLINICAL_REVIEW_API_KEY:-}
      PRIMARY_CLINICAL_REVIEW_API_URL: ${PRIMARY_CLINICAL_REVIEW_API_URL:-}
      PRIMARY_CLINICAL_REVIEW_REASONING_EFFORT: ${PRIMARY_CLINICAL_REVIEW_REASONING_EFFORT:-low}
      PRIMARY_CLINICAL_REVIEW_TIMEOUT_MS: ${PRIMARY_CLINICAL_REVIEW_TIMEOUT_MS:-30000}
      PRIMARY_CLINICAL_REVIEW_CHAIN_TIMEOUT_MS: ${PRIMARY_CLINICAL_REVIEW_CHAIN_TIMEOUT_MS:-35000}
      PRIMARY_CLINICAL_REVIEW_ALLOWED_HOSTS: ${PRIMARY_CLINICAL_REVIEW_ALLOWED_HOSTS:-}
      PRIMARY_DIAGNOSE_REVIEW_FALLBACK_MODEL: ${PRIMARY_DIAGNOSE_REVIEW_FALLBACK_MODEL:-deepseek-v4-flash}
      PRIMARY_PRESCRIBE_REVIEW_FALLBACK_MODEL: ${PRIMARY_PRESCRIBE_REVIEW_FALLBACK_MODEL:-deepseek-v4-pro}
      CLINICAL_FACTS_MODEL: ${CLINICAL_FACTS_MODEL:-deepseek-v4-flash}
      CLINICAL_FACTS_REPAIR_MODEL: ${CLINICAL_FACTS_REPAIR_MODEL:-deepseek-v4-pro}
      PRIMARY_TEXT_MAX_TOKENS: ${PRIMARY_TEXT_MAX_TOKENS:-14000}
      PRIMARY_TEXT_REASONING_EFFORT: ${PRIMARY_TEXT_REASONING_EFFORT:-low}
      PRIMARY_TEXT_THINKING_ENABLED: ${PRIMARY_TEXT_THINKING_ENABLED:-false}
      PRIMARY_TEXT_TEMPERATURE: ${PRIMARY_TEXT_TEMPERATURE:-0.1}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_VISION_ENABLED: ${GLM_VISION_ENABLED:-false}
      GLM_VISION_MODEL: ${GLM_VISION_MODEL:-glm-5v-turbo}
      GLM_VISION_TOTAL_TIMEOUT_MS: ${GLM_VISION_TOTAL_TIMEOUT_MS:-120000}
      GLM_VISION_THINKING_ENABLED: ${GLM_VISION_THINKING_ENABLED:-false}
      EVIMED_API_KEY: ${EVIMED_API_KEY:-}
      EVIMED_EVIDENCE_API_KEY: ${EVIMED_EVIDENCE_API_KEY:-}
      EVIMED_EVIDENCE_BASE_URL: ${EVIMED_EVIDENCE_BASE_URL:-https://www.evimed.com/api-evimed}
      EVIMED_GUIDE_API_KEY: ${EVIMED_GUIDE_API_KEY:-}
      EVIMED_INSTRUCTION_API_KEY: ${EVIMED_INSTRUCTION_API_KEY:-}
      EVIMED_LITERATURE_API_KEY: ${EVIMED_LITERATURE_API_KEY:-}
      EVIMED_EVIDENCE_TIMEOUT_MS: ${EVIMED_EVIDENCE_TIMEOUT_MS:-12000}
      EVIMED_GUIDE_API_URL: ${EVIMED_GUIDE_API_URL:-}
      EVIMED_INSTRUCTION_API_URL: ${EVIMED_INSTRUCTION_API_URL:-}
      EVIMED_LITERATURE_API_URL: ${EVIMED_LITERATURE_API_URL:-}
      RXAI_AUDIT_ENABLED: ${RXAI_AUDIT_ENABLED:-false}
      RXAI_AUDIT_BASE_URL: ${RXAI_AUDIT_BASE_URL:-}
      RXAI_AUDIT_ALLOW_INSECURE_HTTP: ${RXAI_AUDIT_ALLOW_INSECURE_HTTP:-false}
      RXAI_AUDIT_TENANT_ID: ${RXAI_AUDIT_TENANT_ID:-EH_INTERNET_HOSPITAL}
      RXAI_AUDIT_SYSTEM_CODE: ${RXAI_AUDIT_SYSTEM_CODE:-EH_INTERNET_HOSPITAL}
      RXAI_AUDIT_TOKEN: ${RXAI_AUDIT_TOKEN:-}
      RXAI_AUDIT_TOTAL_TIMEOUT_MS: ${RXAI_AUDIT_TOTAL_TIMEOUT_MS:-15000}
      RXAI_AUDIT_ATTEMPT_TIMEOUT_MS: ${RXAI_AUDIT_ATTEMPT_TIMEOUT_MS:-12000}
      RXAI_AUDIT_TIMEOUT_MS: ${RXAI_AUDIT_TIMEOUT_MS:-}
      RXAI_AUDIT_RETRY_ATTEMPTS: ${RXAI_AUDIT_RETRY_ATTEMPTS:-1}
      CDSS_API_TOKEN: ${CDSS_API_TOKEN:?set CDSS_API_TOKEN}
      CASE_SNAPSHOT_ENCRYPTION_KEY: ${CASE_SNAPSHOT_ENCRYPTION_KEY:?set CASE_SNAPSHOT_ENCRYPTION_KEY}
      REASONING_CONTRACT_SIGNING_KEY: ${REASONING_CONTRACT_SIGNING_KEY:?set REASONING_CONTRACT_SIGNING_KEY}
      # Deployment capability is the upper bound. Per-case input may only narrow this list.
      TCM_CLINIC_TREATMENT_CAPABILITIES_JSON: ${TCM_CLINIC_TREATMENT_CAPABILITIES_JSON:-}
      TCM_CLINIC_TREATMENT_CAPABILITIES: ${TCM_CLINIC_TREATMENT_CAPABILITIES:-}
      CDSS_REQUIRE_API_AUTH: ${CDSS_REQUIRE_API_AUTH:-true}
      # Container is loopback-bound by default; production should sit behind a trusted local TLS reverse proxy.
      # Required release declaration: true only behind an edge that strips client-supplied proxy
      # headers and writes X-Real-IP. strictReady remains false when this is not true.
      CDSS_TRUST_PROXY_HEADERS: ${CDSS_TRUST_PROXY_HEADERS:?set CDSS_TRUST_PROXY_HEADERS=true behind the trusted TLS reverse proxy}
      CDSS_TRUST_X_FORWARDED_FOR: ${CDSS_TRUST_X_FORWARDED_FOR:-true}
      CDSS_ALLOW_X_FORWARDED_FOR_CLIENT_KEY: ${CDSS_ALLOW_X_FORWARDED_FOR_CLIENT_KEY:-false}
      CDSS_TRUST_CF_CONNECTING_IP: ${CDSS_TRUST_CF_CONNECTING_IP:-false}
      CDSS_SECURE_COOKIE: ${CDSS_SECURE_COOKIE:-true}
      NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE: ${NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE:-true}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/tcm-cdss}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000'+(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/api/diagnosis/health?strict=1',{headers:{'x-cdss-api-token':process.env.CDSS_API_TOKEN||''}}).then(async r=>{const j=await r.json();if(!r.ok||j.strictReady!==true)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 30s
      retries: 6
      start_period: 60s
