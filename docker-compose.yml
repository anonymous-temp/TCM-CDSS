services:
  tcm-cdss:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/tcm-cdss}
        NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE: ${NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE:-true}
        NEXT_DEPLOYMENT_ID: ${IMAGE_TAG:?set immutable IMAGE_TAG}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    image: "tcm-cdss:${IMAGE_TAG:?set immutable IMAGE_TAG}"
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      CDSS_RELEASE_ID: ${IMAGE_TAG:?set immutable IMAGE_TAG}
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-bailian-qwen}
      CDSS_EXPLICIT_PROMPT_CACHE: ${CDSS_EXPLICIT_PROMPT_CACHE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      CDSS_TEXT_MODEL_ALLOWED_HOSTS: ${CDSS_TEXT_MODEL_ALLOWED_HOSTS:-}
      CDSS_DEEPSEEK_ALLOWED_HOSTS: ${CDSS_DEEPSEEK_ALLOWED_HOSTS:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      # 首轮生成换 DeepSeek（2026-09-24，提速第三批）：同一批真实提示词，西医半 24→8s、中医半
      # 29→10s、M04 27→11s、M02 出题 15→4s。DeepSeek 只有 json_object，所以服务端按严格 schema
      # 逐项校验，不合规或连不上就由 PRIMARY_STRUCTURED_FALLBACK_MODEL（严格 schema）对同一份
      # 提示词重生成——质量下限即改动前。修复轮与临床事实三相位仍是 qwen3.8-max。
      # 回滚：这四个变量改回 qwen3.8-flash（PRIMARY_QUESTION_MODEL 删掉即跟随主模型），无需重建镜像。
      PRIMARY_QUESTION_MODEL: ${PRIMARY_QUESTION_MODEL:-deepseek-flash}
      PRIMARY_STRUCTURED_FALLBACK_MODEL: ${PRIMARY_STRUCTURED_FALLBACK_MODEL:-qwen3.8-flash}
      PRIMARY_PRESCRIBE_MODEL: ${PRIMARY_PRESCRIBE_MODEL:-deepseek-flash}
      STRUCTURED_INITIAL_CONNECT_TIMEOUT_MS: ${STRUCTURED_INITIAL_CONNECT_TIMEOUT_MS:-25000}
      PRIMARY_PRESCRIBE_CONNECT_FALLBACK_MODEL: ${PRIMARY_PRESCRIBE_CONNECT_FALLBACK_MODEL:-qwen3.8-max}
      PRIMARY_PRESCRIBE_REASONING_EFFORT: ${PRIMARY_PRESCRIBE_REASONING_EFFORT:-medium}
      PRIMARY_PRESCRIBE_REPAIR_REASONING_EFFORT: ${PRIMARY_PRESCRIBE_REPAIR_REASONING_EFFORT:-medium}
      PRIMARY_PRESCRIBE_THINKING_ENABLED: ${PRIMARY_PRESCRIBE_THINKING_ENABLED:-false}
      # M04 候选方药正文较长(药味清单+君臣佐使+配伍),给独立更高上限避免截断。
      PRIMARY_PRESCRIBE_MAX_TOKENS: ${PRIMARY_PRESCRIBE_MAX_TOKENS:-24000}
      # Qwen stays on two tiers (2026-09-19): qwen3.8-flash as the strict fallback for the DeepSeek first
      # passes, qwen3.8-max for repair rounds and clinical-facts extraction. Both enforce strict
      # JSON Schema; qwen3.7-flash does not, so it is no longer a rollback for structured stages.
      # With a DeepSeek first pass, the M04 transport fallback is PRIMARY_STRUCTURED_FALLBACK_MODEL.
      PRIMARY_DIAGNOSE_MODEL: ${PRIMARY_DIAGNOSE_MODEL:-deepseek-flash}
      PRIMARY_DIAGNOSE_REPAIR_MODEL: ${PRIMARY_DIAGNOSE_REPAIR_MODEL:-qwen3.8-max}
      PRIMARY_DIAGNOSE_REASONING_EFFORT: ${PRIMARY_DIAGNOSE_REASONING_EFFORT:-medium}
      PRIMARY_DIAGNOSE_MAX_TOKENS: ${PRIMARY_DIAGNOSE_MAX_TOKENS:-24000}
      PRIMARY_DIAGNOSE_THINKING_ENABLED: ${PRIMARY_DIAGNOSE_THINKING_ENABLED:-false}
      PRIMARY_PRESCRIBE_REPAIR_MODEL: ${PRIMARY_PRESCRIBE_REPAIR_MODEL:-qwen3.8-max}
      # Primary text reasoning defaults to Bailian Qwen; GLM remains tongue-image-only.
      BAILIAN_QWEN_API_KEY: ${BAILIAN_QWEN_API_KEY:?set BAILIAN_QWEN_API_KEY}
      BAILIAN_QWEN_BASE_URL: ${BAILIAN_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_QWEN_MODEL: ${BAILIAN_QWEN_MODEL:-qwen3.8-flash}
      CLINICAL_FACTS_MODEL: ${CLINICAL_FACTS_MODEL:-qwen3.8-max}
      M02_MIN_INFORMATION_GAIN: ${M02_MIN_INFORMATION_GAIN:-0.6}
      # GOV-08 explicit exception: independent closed-set terminology classification, never a
      # fallback clinical reasoner. The persistent cache turns accepted variants into a stable,
      # deterministic path after the first two-call consensus.
      CONTROLLED_TERMINOLOGY_NORMALIZATION: ${CONTROLLED_TERMINOLOGY_NORMALIZATION:-true}
      # 小任务在 DeepSeek 上快 2–5 倍（2026-09-20 本机 A/B）；主生成留在 Qwen 严格 schema。
      CONTROLLED_TERMINOLOGY_MODEL: ${CONTROLLED_TERMINOLOGY_MODEL:-deepseek-flash}
      PRIMARY_REVIEW_MODEL: ${PRIMARY_REVIEW_MODEL:-deepseek-flash}
      CONTROLLED_TERMINOLOGY_MIN_CONFIDENCE: ${CONTROLLED_TERMINOLOGY_MIN_CONFIDENCE:-0.8}
      FORMULA_RECALL_NORMALIZATION: ${FORMULA_RECALL_NORMALIZATION:-true}
      POLARITY_NEGATION_ASSIST: ${POLARITY_NEGATION_ASSIST:-true}
      SYNDROME_HYPOTHESIS_RERANK: ${SYNDROME_HYPOTHESIS_RERANK:-true}
      # 小任务时限（2026-09-20 放宽；都可在此覆盖，调预算不必重建镜像）。
      SYNDROME_RERANK_TIMEOUT_MS: ${SYNDROME_RERANK_TIMEOUT_MS:-10000}
      M05_FOLLOWUP_AUTHORING_TIMEOUT_MS: ${M05_FOLLOWUP_AUTHORING_TIMEOUT_MS:-20000}
      M02_QUESTION_REVIEW_TIMEOUT_MS: ${M02_QUESTION_REVIEW_TIMEOUT_MS:-20000}
      CLINICAL_FACTS_PHASE_TIMEOUT_MS: ${CLINICAL_FACTS_PHASE_TIMEOUT_MS:-15000}
      # 事实层复核/裁决相位已删除（2026-09-25；09-20 起缺省关闭，复核对安全门输入净差异 0/198）。
      # CDSS_CLINICAL_FACTS_REVIEW / CLINICAL_FACTS_REVIEW_MODEL / CLINICAL_FACTS_ADJUDICATION_MODEL 不再被读取。
      # 容器健康检查缺省**不发**上游实调探针（2026-09-20 owner 裁定暂停）：每 60s 一次 strict=1 会实调
      # 事实层/术语模型、GLM 视觉与证据源，每天约 1000 次模型调用。非严格模式仍按**配置**计算
      # strictReady，新依赖没配齐照样判不健康；上线时的实调由 verify:deployed-image 负责。设 true 恢复。
      CDSS_HEALTHCHECK_LIVE_PROBES: ${CDSS_HEALTHCHECK_LIVE_PROBES:-false}
      CONTROLLED_TERMINOLOGY_CACHE_PATH: /app/runtime-data/controlled-terminology-cache.json
      # 院内药品库存（入站药品同步）。与上一项共用已挂载的 tcm-cdss-runtime 卷，重启与重新部署都不丢。
      CDSS_DRUG_INVENTORY_PATH: /app/runtime-data/drug-inventory
      CDSS_CUSTOMER_REGISTRY_PATH: /app/runtime-data/customer-registry.json
      CDSS_TENANT_AUDIT_PATH: /app/runtime-data/tenant-audit.ndjson
      CDSS_TENANT_AUDIT_MAX_BYTES: ${CDSS_TENANT_AUDIT_MAX_BYTES:-8000000}
      CDSS_TENANT_AUDIT_ARCHIVE_FILES: ${CDSS_TENANT_AUDIT_ARCHIVE_FILES:-4}
      PRIMARY_TEXT_MAX_TOKENS: ${PRIMARY_TEXT_MAX_TOKENS:-14000}
      # M03/M04 编排总时限门禁（代码钳制 60–180s）。富上下文（证据/检索注入）下首诊被合同拒绝后
      # 需要预留一次完整修复轮次的时间，默认 120s 容易在修复中途触顶降级。
      M03_ORCHESTRATION_DEADLINE_MS: ${M03_ORCHESTRATION_DEADLINE_MS:-180000}
      M04_ORCHESTRATION_DEADLINE_MS: ${M04_ORCHESTRATION_DEADLINE_MS:-180000}
      PRIMARY_STRUCTURED_STAGE_MAX_CONCURRENCY: ${PRIMARY_STRUCTURED_STAGE_MAX_CONCURRENCY:-3}
      PRIMARY_STRUCTURED_STAGE_QUEUE_TIMEOUT_MS: ${PRIMARY_STRUCTURED_STAGE_QUEUE_TIMEOUT_MS:-25000}
      STRUCTURED_QUALITY_REPAIR_ROUNDS: ${STRUCTURED_QUALITY_REPAIR_ROUNDS:-0}
      CDSS_STRICT_HEALTH_RATE_LIMIT_PER_10_MIN: ${CDSS_STRICT_HEALTH_RATE_LIMIT_PER_10_MIN:-60}
      PRIMARY_TEXT_REASONING_EFFORT: ${PRIMARY_TEXT_REASONING_EFFORT:-low}
      PRIMARY_TEXT_THINKING_ENABLED: ${PRIMARY_TEXT_THINKING_ENABLED:-false}
      PRIMARY_TEXT_TEMPERATURE: ${PRIMARY_TEXT_TEMPERATURE:-0.1}
      GLM_API_KEY: ${GLM_API_KEY:-}
      TONGUE_VISION_PROVIDER: ${TONGUE_VISION_PROVIDER:-glm}
      GLM_VISION_ENABLED: ${GLM_VISION_ENABLED:-true}
      GLM_VISION_MODEL: ${GLM_VISION_MODEL:-glm-5v-turbo}
      GLM_VISION_TOTAL_TIMEOUT_MS: ${GLM_VISION_TOTAL_TIMEOUT_MS:-120000}
      GLM_VISION_THINKING_ENABLED: ${GLM_VISION_THINKING_ENABLED:-false}
      EVIMED_API_KEY: ${EVIMED_API_KEY:-}
      EVIMED_EVIDENCE_API_KEY: ${EVIMED_EVIDENCE_API_KEY:-}
      EVIMED_EVIDENCE_BASE_URL: ${EVIMED_EVIDENCE_BASE_URL:-https://www.evimed.com/api-evimed}
      EVIMED_GUIDE_API_KEY: ${EVIMED_GUIDE_API_KEY:-}
      EVIMED_INSTRUCTION_API_KEY: ${EVIMED_INSTRUCTION_API_KEY:-}
      EVIMED_LITERATURE_API_KEY: ${EVIMED_LITERATURE_API_KEY:-}
      EVIMED_EVIDENCE_TIMEOUT_MS: ${EVIMED_EVIDENCE_TIMEOUT_MS:-12000}
      EVIDENCE_RERANK_ENABLED: ${EVIDENCE_RERANK_ENABLED:-false}
      EVIMED_GUIDE_API_URL: ${EVIMED_GUIDE_API_URL:-}
      EVIMED_INSTRUCTION_API_URL: ${EVIMED_INSTRUCTION_API_URL:-}
      EVIMED_LITERATURE_API_URL: ${EVIMED_LITERATURE_API_URL:-}
      CDSS_API_TOKEN: ${CDSS_API_TOKEN:?set CDSS_API_TOKEN}
      CDSS_API_CLIENT_ID: ${CDSS_API_CLIENT_ID:?set CDSS_API_CLIENT_ID}
      CDSS_API_CUSTOMER_IDS: ${CDSS_API_CUSTOMER_IDS:?set CDSS_API_CUSTOMER_IDS}
      CDSS_CUSTOMER_JIT_ENABLED: ${CDSS_CUSTOMER_JIT_ENABLED:-true}
      CDSS_CUSTOMER_JIT_MAX_CUSTOMERS: ${CDSS_CUSTOMER_JIT_MAX_CUSTOMERS:-100}
      CDSS_DEFAULT_CUSTOMER_ID: ${CDSS_DEFAULT_CUSTOMER_ID:-}
      CASE_SNAPSHOT_ENCRYPTION_KEY: ${CASE_SNAPSHOT_ENCRYPTION_KEY:?set CASE_SNAPSHOT_ENCRYPTION_KEY}
      REASONING_CONTRACT_SIGNING_KEY: ${REASONING_CONTRACT_SIGNING_KEY:?set REASONING_CONTRACT_SIGNING_KEY}
      # Deployment capability is the upper bound. Per-case input may only narrow this list.
      TCM_CLINIC_TREATMENT_CAPABILITIES_JSON: ${TCM_CLINIC_TREATMENT_CAPABILITIES_JSON:-}
      TCM_CLINIC_TREATMENT_CAPABILITIES: ${TCM_CLINIC_TREATMENT_CAPABILITIES:-}
      CDSS_REQUIRE_API_AUTH: ${CDSS_REQUIRE_API_AUTH:-true}
      # Container is loopback-bound by default; production should sit behind a trusted local TLS reverse proxy.
      # Required release declaration: true only behind an edge that strips client-supplied proxy
      # headers and writes X-Real-IP. strictReady remains false when this is not true.
      CDSS_TRUST_PROXY_HEADERS: ${CDSS_TRUST_PROXY_HEADERS:?set CDSS_TRUST_PROXY_HEADERS=true behind the trusted TLS reverse proxy}
      CDSS_TRUST_X_FORWARDED_FOR: ${CDSS_TRUST_X_FORWARDED_FOR:-true}
      CDSS_ALLOW_X_FORWARDED_FOR_CLIENT_KEY: ${CDSS_ALLOW_X_FORWARDED_FOR_CLIENT_KEY:-false}
      CDSS_TRUST_CF_CONNECTING_IP: ${CDSS_TRUST_CF_CONNECTING_IP:-false}
      CDSS_MODEL_RATE_LIMIT_PER_10_MIN: ${CDSS_MODEL_RATE_LIMIT_PER_10_MIN:-60}
      CDSS_SECURE_COOKIE: ${CDSS_SECURE_COOKIE:-true}
      NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE: ${NEXT_PUBLIC_ENABLE_BROWSER_CASE_PERSISTENCE:-true}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/tcm-cdss}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tcm-cdss-runtime:/app/runtime-data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const q=process.env.CDSS_HEALTHCHECK_LIVE_PROBES==='true'?'?strict=1':'';fetch('http://127.0.0.1:3000'+(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/api/diagnosis/health'+q,{headers:{'x-cdss-api-token':process.env.CDSS_API_TOKEN||''}}).then(async r=>{const j=await r.json();if(!r.ok||j.strictReady!==true)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 30s
      retries: 6
      start_period: 60s

volumes:
  tcm-cdss-runtime:
